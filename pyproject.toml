[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-memory-transformer"
version = "0.1.0"
description = "Inspectable research code for tiny Transformers and bounded persistent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Narender Singh" }]
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
]

[project.scripts]
bmt-train-tiny = "bounded_memory_transformer.cli.train_tiny:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
